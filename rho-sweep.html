<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#060606" />
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <title>Rho Sweep Explorer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #060606;
      --surface: #0b0b0b;
      --surface-raised: #101010;
      --text: #f1f1ec;
      --muted: #aaa9a1;
      --faint: #66665f;
      --line: #2b2b28;
      --accent: #00cc66;
      --accent-bright: #d6ffe6;
      --accent-deep: #0a2e1c;
      --focus: #f1f1ec;
    }

    @media (prefers-color-scheme: light) {
      :root {
        color-scheme: light;
        --bg: #f4f4ef;
        --surface: #ebebe5;
        --surface-raised: #ffffff;
        --text: #151512;
        --muted: #575751;
        --faint: #85857c;
        --line: #cecec4;
        --focus: #151512;
      }
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-width: 280px;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: "IBM Plex Mono", "Cascadia Mono", ui-monospace, monospace;
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    main {
      width: min(1180px, 100%);
      margin: 0 auto;
      padding: 14px 14px calc(30px + env(safe-area-inset-bottom));
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 18px;
    }

    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 1 / 1;
      min-height: 280px;
      overflow: hidden;
      background: #060606;
      border: 1px solid #1d1d1b;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .stage-meta {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      pointer-events: none;
      color: #d8d8d0;
      text-shadow: 0 1px 8px #060606, 0 1px 4px #060606;
    }

    .rho-readout {
      font-size: clamp(20px, 6vw, 34px);
      line-height: 1;
      font-weight: 500;
      letter-spacing: -0.04em;
    }

    .stage-label {
      margin-top: 5px;
      color: #919188;
      font-size: 11px;
    }

    .regime {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      padding: 4px 8px;
      border: 1px solid #34342f;
      background: rgba(6, 6, 6, 0.76);
      font-size: 11px;
      white-space: nowrap;
    }

    .regime-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .busy {
      position: absolute;
      left: 14px;
      bottom: 12px;
      color: #8a8a82;
      font-size: 10px;
      letter-spacing: 0.02em;
      opacity: 0;
      transition: opacity 100ms linear;
    }
    .busy.show { opacity: 1; }

    .panel {
      display: flex;
      flex-direction: column;
      min-width: 0;
      gap: 18px;
    }

    .control-block {
      border-top: 1px solid var(--line);
      padding-top: 13px;
    }

    .control-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }

    .control-title {
      margin: 0;
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    .range-values {
      color: var(--faint);
      font-size: 10px;
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      min-height: 44px;
    }

    input[type="range"] {
      --pct: 13.2%;
      appearance: none;
      width: 100%;
      height: 28px;
      margin: 0;
      background: transparent;
      cursor: ew-resize;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 3px;
      background: linear-gradient(to right, var(--accent) 0 var(--pct), var(--line) var(--pct) 100%);
    }
    input[type="range"]::-moz-range-track {
      height: 3px;
      background: var(--line);
    }
    input[type="range"]::-moz-range-progress {
      height: 3px;
      background: var(--accent);
    }
    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 22px;
      height: 22px;
      margin-top: -9.5px;
      border: 2px solid var(--accent-bright);
      border-radius: 50%;
      background: var(--bg);
      box-shadow: 0 0 0 3px rgba(6, 6, 6, 0.8);
    }
    input[type="range"]::-moz-range-thumb {
      width: 18px;
      height: 18px;
      border: 2px solid var(--accent-bright);
      border-radius: 50%;
      background: var(--bg);
    }

    input[type="range"]:focus-visible,
    button:focus-visible {
      outline: 2px solid var(--focus);
      outline-offset: 3px;
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .preset {
      min-height: 48px;
      padding: 7px 9px;
      border: 1px solid var(--line);
      border-radius: 0;
      background: transparent;
      text-align: left;
      cursor: pointer;
    }
    .preset:hover { background: var(--surface); }
    .preset[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent-deep);
    }
    .preset-rho {
      display: block;
      color: var(--text);
      font-size: 12px;
    }
    .preset-name {
      display: block;
      margin-top: 1px;
      color: var(--muted);
      font-size: 10px;
    }

    .mode-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .mode-copy {
      min-width: 0;
    }
    .mode-copy strong {
      display: block;
      font-size: 12px;
      font-weight: 500;
    }
    .mode-copy span {
      display: block;
      margin-top: 2px;
      color: var(--muted);
      font-size: 10px;
    }

    .toggle {
      position: relative;
      flex: 0 0 auto;
      width: 58px;
      height: 34px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 0;
      background: var(--surface);
      cursor: pointer;
    }
    .toggle::after {
      content: "";
      position: absolute;
      top: 6px;
      left: 7px;
      width: 20px;
      height: 20px;
      background: var(--muted);
      transition: transform 180ms ease, background 180ms ease;
    }
    .toggle[aria-pressed="true"] {
      border-color: var(--accent);
      background: var(--accent-deep);
    }
    .toggle[aria-pressed="true"]::after {
      transform: translateX(23px);
      background: var(--accent-bright);
    }

    .palette-key {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 11px;
      color: var(--muted);
      font-size: 10px;
    }
    .palette-swatch {
      width: 24px;
      height: 2px;
      background: linear-gradient(90deg, var(--accent), var(--accent-bright));
      box-shadow: 0 0 7px var(--accent);
    }

    .threshold-note {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }
    .threshold-note strong {
      color: var(--text);
      font-weight: 500;
    }

    .equations {
      display: grid;
      grid-template-columns: 1fr;
      gap: 4px;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: clamp(10px, 2.8vw, 12px);
      overflow-wrap: anywhere;
    }
    .constants {
      margin-top: 7px;
      color: var(--faint);
      font-size: 10px;
    }

    @media (min-width: 760px) {
      main { padding: 24px 24px 40px; }
      .workspace {
        grid-template-columns: minmax(0, 1fr) 300px;
        align-items: start;
        gap: 28px;
      }
      .stage { min-height: 0; }
      .panel { padding-top: 4px; }
      .equations {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
        margin-top: 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .toggle::after { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <section class="workspace" aria-label="Interactive Lorenz system">
      <div class="stage" id="stage">
        <canvas id="attractor" aria-label="Lorenz attractor trajectory in the x–z projection"></canvas>
        <div class="stage-meta" aria-hidden="true">
          <div>
            <div class="rho-readout">ρ = <span id="rhoDisplay">28.0</span></div>
            <div class="stage-label" id="projectionLabel">x–z projection</div>
          </div>
          <div class="regime"><span class="regime-dot"></span><span id="regimeLabel">chaotic</span></div>
        </div>
        <div class="busy" id="busy" aria-live="polite">integrating trajectory…</div>
      </div>

      <div class="panel">
        <section class="control-block" aria-labelledby="rhoControlTitle">
          <div class="control-head">
            <h2 class="control-title" id="rhoControlTitle">ρ / rho</h2>
            <span class="range-values">14 — 120</span>
          </div>
          <div class="slider-wrap">
            <input id="rhoSlider" type="range" min="14" max="120" value="28" step="0.5" aria-label="Rho parameter" aria-valuetext="28, chaotic" />
          </div>
          <div class="presets" aria-label="Study presets">
            <button class="preset" type="button" data-rho="20" aria-pressed="false"><span class="preset-rho">ρ 20</span><span class="preset-name">settling</span></button>
            <button class="preset" type="button" data-rho="28" aria-pressed="true"><span class="preset-rho">ρ 28</span><span class="preset-name">classic</span></button>
            <button class="preset" type="button" data-rho="60" aria-pressed="false"><span class="preset-rho">ρ 60</span><span class="preset-name">tightening</span></button>
            <button class="preset" type="button" data-rho="120" aria-pressed="false"><span class="preset-rho">ρ 120</span><span class="preset-name">wild</span></button>
          </div>
        </section>

        <section class="control-block">
          <div class="mode-row">
            <div class="mode-copy">
              <strong>slow rotation</strong>
              <span>turn the same trajectory in 3D</span>
            </div>
            <button class="toggle" id="rotationToggle" type="button" role="switch" aria-checked="false" aria-pressed="false" aria-label="Toggle slow 3D rotation"></button>
          </div>
          <div class="palette-key"><span class="palette-swatch"></span><span id="paletteName">phosphor / nearest study</span></div>
        </section>

        <section class="control-block">
          <p class="threshold-note" id="thresholdNote"><strong>Above ρ ≈ 24.7.</strong> Deterministic, bounded, never repeating.</p>
        </section>
      </div>
    </section>

    <footer>
      <div class="equations" aria-label="Lorenz equations">
        <span>dx/dt = σ(y − x)</span>
        <span>dy/dt = x(ρ − z) − y</span>
        <span>dz/dt = xy − βz</span>
      </div>
      <div class="constants">σ = 10 &nbsp;·&nbsp; β = 8/3 &nbsp;·&nbsp; start = (1, 1, 1)</div>
    </footer>
  </main>

  <script>
    (function () {
      "use strict";

      var SIGMA = 10;
      var BETA = 8 / 3;
      var CRITICAL_RHO = 24.7368;
      var STEP_COUNT = 18000;
      var DISCARD = 2700;
      var DT = 0.0075;

      var PALETTES = [
        { rho: 20, name: "amber", deep: "#3a1500", mid: "#ff8c1a", bright: "#ffe9c4" },
        { rho: 28, name: "phosphor", deep: "#0a2e1c", mid: "#00cc66", bright: "#d6ffe6" },
        { rho: 60, name: "ice", deep: "#0a1a3a", mid: "#1a9fff", bright: "#d9f2ff" },
        { rho: 120, name: "violet", deep: "#1c0a3a", mid: "#9a4dff", bright: "#f2e2ff" }
      ];

      var canvas = document.getElementById("attractor");
      var stage = document.getElementById("stage");
      var ctx = canvas.getContext("2d", { alpha: false });
      var slider = document.getElementById("rhoSlider");
      var rhoDisplay = document.getElementById("rhoDisplay");
      var regimeLabel = document.getElementById("regimeLabel");
      var projectionLabel = document.getElementById("projectionLabel");
      var paletteName = document.getElementById("paletteName");
      var thresholdNote = document.getElementById("thresholdNote");
      var rotationToggle = document.getElementById("rotationToggle");
      var busy = document.getElementById("busy");
      var presetButtons = Array.prototype.slice.call(document.querySelectorAll(".preset"));

      var state = {
        rho: 28,
        trajectory: null,
        palette: PALETTES[1],
        rotating: false,
        angle: -0.32,
        animation: 0,
        debounce: 0,
        renderWidth: 0,
        renderHeight: 0,
        colors: []
      };

      function hexToRgb(hex) {
        return [parseInt(hex.slice(1, 3), 16), parseInt(hex.slice(3, 5), 16), parseInt(hex.slice(5, 7), 16)];
      }

      function mixColor(a, b, t) {
        return "rgb(" + Math.round(a[0] + (b[0] - a[0]) * t) + "," + Math.round(a[1] + (b[1] - a[1]) * t) + "," + Math.round(a[2] + (b[2] - a[2]) * t) + ")";
      }

      function nearestPalette(rho) {
        var closest = PALETTES[0];
        for (var i = 1; i < PALETTES.length; i += 1) {
          if (Math.abs(PALETTES[i].rho - rho) < Math.abs(closest.rho - rho)) closest = PALETTES[i];
        }
        return closest;
      }

      function derivative(x, y, z, rho) {
        return [SIGMA * (y - x), x * (rho - z) - y, x * y - BETA * z];
      }

      function integrate(rho) {
        var kept = STEP_COUNT - DISCARD;
        var points = new Float32Array(kept * 3);
        var x = 1, y = 1, z = 1;
        var p = 0;

        for (var i = 0; i < STEP_COUNT; i += 1) {
          var k1 = derivative(x, y, z, rho);
          var k2 = derivative(x + k1[0] * DT / 2, y + k1[1] * DT / 2, z + k1[2] * DT / 2, rho);
          var k3 = derivative(x + k2[0] * DT / 2, y + k2[1] * DT / 2, z + k2[2] * DT / 2, rho);
          var k4 = derivative(x + k3[0] * DT, y + k3[1] * DT, z + k3[2] * DT, rho);

          x += DT * (k1[0] + 2 * k2[0] + 2 * k3[0] + k4[0]) / 6;
          y += DT * (k1[1] + 2 * k2[1] + 2 * k3[1] + k4[1]) / 6;
          z += DT * (k1[2] + 2 * k2[2] + 2 * k3[2] + k4[2]) / 6;

          if (i >= DISCARD) {
            points[p++] = x;
            points[p++] = y;
            points[p++] = z;
          }
        }
        return points;
      }

      function buildColors(palette) {
        var deep = hexToRgb(palette.deep);
        var mid = hexToRgb(palette.mid);
        var bright = hexToRgb(palette.bright);
        var colors = [];
        for (var i = 0; i < 32; i += 1) {
          var t = i / 31;
          colors.push(t < 0.55 ? mixColor(deep, mid, t / 0.55) : mixColor(mid, bright, (t - 0.55) / 0.45));
        }
        return colors;
      }

      function updatePalette(rho) {
        state.palette = nearestPalette(rho);
        state.colors = buildColors(state.palette);
        document.documentElement.style.setProperty("--accent", state.palette.mid);
        document.documentElement.style.setProperty("--accent-bright", state.palette.bright);
        document.documentElement.style.setProperty("--accent-deep", state.palette.deep);
        paletteName.textContent = state.palette.name + " / nearest study";
      }

      function updateLabels(rho) {
        var chaotic = rho >= CRITICAL_RHO;
        rhoDisplay.textContent = rho.toFixed(1);
        regimeLabel.textContent = chaotic ? "chaotic" : "settling";
        slider.setAttribute("aria-valuetext", rho.toFixed(1) + ", " + (chaotic ? "chaotic" : "settling"));
        thresholdNote.innerHTML = chaotic
          ? "<strong>Past the stability threshold.</strong> Chaos is common here, with periodic windows between; the system stays deterministic and bounded."
          : "<strong>Below the stability threshold.</strong> The orbit spirals into one of two fixed points.";
        slider.style.setProperty("--pct", ((rho - 14) / 106 * 100).toFixed(2) + "%");
        presetButtons.forEach(function (button) {
          button.setAttribute("aria-pressed", Number(button.getAttribute("data-rho")) === rho ? "true" : "false");
        });
      }

      function resizeCanvas() {
        var rect = stage.getBoundingClientRect();
        var dpr = Math.min(window.devicePixelRatio || 1, 2);
        var width = Math.max(1, Math.round(rect.width * dpr));
        var height = Math.max(1, Math.round(rect.height * dpr));
        if (width !== canvas.width || height !== canvas.height) {
          canvas.width = width;
          canvas.height = height;
          state.renderWidth = width;
          state.renderHeight = height;
          render(state.angle);
        }
      }

      function projectedBounds(points, angle, stride) {
        var ca = Math.cos(angle), sa = Math.sin(angle);
        var minX = Infinity, maxX = -Infinity, minZ = Infinity, maxZ = -Infinity;
        for (var i = 0; i < points.length; i += 3 * stride) {
          var x = points[i], y = points[i + 1], z = points[i + 2];
          var px = x * ca - y * sa;
          var pz = z + (x * sa + y * ca) * 0.12;
          if (px < minX) minX = px;
          if (px > maxX) maxX = px;
          if (pz < minZ) minZ = pz;
          if (pz > maxZ) maxZ = pz;
        }
        return { minX: minX, maxX: maxX, minZ: minZ, maxZ: maxZ };
      }

      function render(angle) {
        var points = state.trajectory;
        if (!points || !canvas.width || !canvas.height) return;

        var w = canvas.width, h = canvas.height;
        var rotatingStride = state.rotating ? 3 : 1;
        var useAngle = state.rotating ? angle : 0;
        var bounds = projectedBounds(points, useAngle, rotatingStride);
        var spanX = Math.max(1, bounds.maxX - bounds.minX);
        var spanZ = Math.max(1, bounds.maxZ - bounds.minZ);
        var pad = Math.min(w, h) * 0.075;
        var scale = Math.min((w - pad * 2) / spanX, (h - pad * 2) / spanZ);
        var centerX = (bounds.minX + bounds.maxX) / 2;
        var centerZ = (bounds.minZ + bounds.maxZ) / 2;
        var ca = Math.cos(useAngle), sa = Math.sin(useAngle);
        var minWorldZ = Infinity, maxWorldZ = -Infinity;
        var i;

        for (i = 2; i < points.length; i += 3 * rotatingStride) {
          if (points[i] < minWorldZ) minWorldZ = points[i];
          if (points[i] > maxWorldZ) maxWorldZ = points[i];
        }
        var zSpan = Math.max(0.001, maxWorldZ - minWorldZ);

        ctx.fillStyle = "#060606";
        ctx.fillRect(0, 0, w, h);
        ctx.lineCap = "round";
        ctx.lineJoin = "round";

        function project(index) {
          var x = points[index], y = points[index + 1], z = points[index + 2];
          var px = x * ca - y * sa;
          var pz = z + (x * sa + y * ca) * 0.12;
          return [w / 2 + (px - centerX) * scale, h / 2 - (pz - centerZ) * scale, z];
        }

        ctx.beginPath();
        var first = project(0);
        ctx.moveTo(first[0], first[1]);
        for (i = 3 * rotatingStride; i < points.length; i += 3 * rotatingStride) {
          var bp = project(i);
          ctx.lineTo(bp[0], bp[1]);
        }
        ctx.strokeStyle = state.palette.mid;
        ctx.globalAlpha = 0.075;
        ctx.lineWidth = Math.max(4, 5.2 * (window.devicePixelRatio || 1));
        ctx.stroke();

        ctx.globalAlpha = 0.92;
        ctx.lineWidth = Math.max(0.7, 0.72 * (window.devicePixelRatio || 1));

        if (state.rotating) {
          var screenGradient = ctx.createLinearGradient(0, h, 0, 0);
          screenGradient.addColorStop(0, state.palette.deep);
          screenGradient.addColorStop(0.58, state.palette.mid);
          screenGradient.addColorStop(1, state.palette.bright);
          ctx.strokeStyle = screenGradient;
          ctx.beginPath();
          var rp = project(0);
          ctx.moveTo(rp[0], rp[1]);
          for (i = 3 * rotatingStride; i < points.length; i += 3 * rotatingStride) {
            rp = project(i);
            ctx.lineTo(rp[0], rp[1]);
          }
          ctx.stroke();
        } else {
          var prev = project(0);
          for (i = 3; i < points.length; i += 3) {
            var next = project(i);
            var t = (next[2] - minWorldZ) / zSpan;
            var colorIndex = Math.max(0, Math.min(31, Math.round(t * 31)));
            ctx.strokeStyle = state.colors[colorIndex];
            ctx.beginPath();
            ctx.moveTo(prev[0], prev[1]);
            ctx.lineTo(next[0], next[1]);
            ctx.stroke();
            prev = next;
          }
        }
        ctx.globalAlpha = 1;
      }

      function recompute(rho) {
        busy.classList.add("show");
        window.requestAnimationFrame(function () {
          state.trajectory = integrate(rho);
          busy.classList.remove("show");
          render(state.angle);
        });
      }

      function setRho(value, immediate) {
        var rho = Math.max(14, Math.min(120, Number(value)));
        state.rho = rho;
        slider.value = String(rho);
        updatePalette(rho);
        updateLabels(rho);
        window.clearTimeout(state.debounce);
        if (immediate) recompute(rho);
        else {
          busy.classList.add("show");
          state.debounce = window.setTimeout(function () { recompute(rho); }, 130);
        }
      }

      function animate() {
        if (!state.rotating) return;
        state.angle += 0.0022;
        render(state.angle);
        state.animation = window.requestAnimationFrame(animate);
      }

      slider.addEventListener("input", function () { setRho(slider.value, false); });
      slider.addEventListener("change", function () { setRho(slider.value, true); });

      presetButtons.forEach(function (button) {
        button.addEventListener("click", function () { setRho(button.getAttribute("data-rho"), true); });
      });

      rotationToggle.addEventListener("click", function () {
        state.rotating = !state.rotating;
        rotationToggle.setAttribute("aria-checked", state.rotating ? "true" : "false");
        rotationToggle.setAttribute("aria-pressed", state.rotating ? "true" : "false");
        projectionLabel.textContent = state.rotating ? "rotating 3D projection" : "x–z projection";
        canvas.setAttribute("aria-label", state.rotating ? "Lorenz attractor trajectory rotating in three dimensions" : "Lorenz attractor trajectory in the x–z projection");
        window.cancelAnimationFrame(state.animation);
        if (state.rotating) animate();
        else render(0);
      });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) window.cancelAnimationFrame(state.animation);
        else if (state.rotating) animate();
      });

      if (window.ResizeObserver) new ResizeObserver(resizeCanvas).observe(stage);
      else window.addEventListener("resize", resizeCanvas);

      updatePalette(state.rho);
      updateLabels(state.rho);
      resizeCanvas();
      recompute(state.rho);
    })();
  </script>
</body>
</html>
